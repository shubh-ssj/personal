let questions=[], mode='practice', answered={};

function startQuiz(){
  const sec=document.getElementById('sectionSel').value;
  mode=document.getElementById('modeSel').value;
  questions=sec==='all'?[...ALL]:ALL.filter(q=>q.s===sec);
  answered={};
  document.getElementById('pTotal').textContent=questions.length;
  document.getElementById('pSec').textContent=sec==='all'?'All':sec==='GK'?'General Knowledge':sec==='ENG'?'General English':'Quantitative Aptitude';
  document.getElementById('controls').style.display='none';
  document.getElementById('progress').style.display='block';
  document.getElementById('navBar').style.display='flex';
  document.getElementById('results').style.display='none';
  document.getElementById('quiz').style.display='block';
  renderQuiz();
}

function renderQuiz(){
  const el=document.getElementById('quiz');
  el.innerHTML=questions.map((q,i)=>{
    const secLabel={'GK':'General Knowledge','ENG':'General English','QA':'Quantitative Aptitude'};
    return `<div class="qcard" id="qcard${i}">
      <div class="qnum">Q${q.n}</div>
      <span class="section-tag ${q.s}">${secLabel[q.s]}</span>
      <div class="qtxt">${q.q}</div>
      <div class="opts">${q.o.map((o,j)=>`
        <label class="opt" id="opt_${i}_${j}">
          <input type="radio" name="q${i}" value="${j}" onchange="pick(${i},${j})"> ${String.fromCharCode(97+j)}) ${o}
        </label>`).join('')}
      </div>
    </div>`;
  }).join('');
  updateAnswered();
}

function pick(qi,oi){
  answered[qi]=oi;
  updateAnswered();
  if(mode==='practice'){
    const q=questions[qi];
    q.o.forEach((_,j)=>{
      const el=document.getElementById(`opt_${qi}_${j}`);
      el.classList.remove('correct','wrong','reveal');
      if(j===q.a) el.classList.add(oi===j?'correct':'reveal');
      else if(j===oi) el.classList.add('wrong');
    });
    document.querySelectorAll(`[name="q${qi}"]`).forEach(r=>r.disabled=true);
  }
  // update current question indicator
  document.getElementById('pCur').textContent=qi+1;
}

function updateAnswered(){
  const n=Object.keys(answered).length;
  document.getElementById('answered').textContent=`${n}/${questions.length} answered`;
}

function submitQuiz(){
  if(mode==='exam'){
    // reveal answers
    questions.forEach((q,i)=>{
      q.o.forEach((_,j)=>{
        const el=document.getElementById(`opt_${i}_${j}`);
        if(el){
          el.classList.remove('correct','wrong','reveal');
          const sel=answered[i];
          if(j===q.a) el.classList.add(sel===j?'correct':'reveal');
          else if(j===sel) el.classList.add('wrong');
        }
      });
      document.querySelectorAll(`[name="q${i}"]`).forEach(r=>r.disabled=true);
    });
  }
  // calc scores
  let total=0,bySection={GK:{c:0,t:0},ENG:{c:0,t:0},QA:{c:0,t:0}};
  questions.forEach((q,i)=>{
    bySection[q.s].t++;
    if(answered[i]===q.a){total++;bySection[q.s].c++;}
  });
  const pct=Math.round(total/questions.length*100);
  document.getElementById('scoreDisp').textContent=`${total} / ${questions.length}`;
  document.getElementById('scoreSub').textContent=`${pct}% — ${pct>=60?'Pass':'Needs Improvement'}`;
  const body=document.getElementById('secBody');
  body.innerHTML='';
  const names={GK:'General Knowledge',ENG:'General English',QA:'Quantitative Aptitude'};
  Object.entries(bySection).forEach(([k,v])=>{
    if(v.t===0)return;
    const p=Math.round(v.c/v.t*100);
    body.innerHTML+=`<tr><td>${names[k]}</td><td>${v.c}/${v.t} (${p}%)</td><td class="${p>=60?'t-pass':'t-fail'}">${p>=60?'Pass':'Needs Work'}</td></tr>`;
  });
  document.getElementById('results').style.display='block';
  document.getElementById('results').scrollIntoView({behavior:'smooth'});
}

function resetQuiz(){
  document.getElementById('controls').style.display='flex';
  document.getElementById('progress').style.display='none';
  document.getElementById('navBar').style.display='none';
  document.getElementById('quiz').style.display='none';
  document.getElementById('results').style.display='none';
  document.getElementById('quiz').innerHTML='';
}
</script>
